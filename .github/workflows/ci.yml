name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Tests
        run: pnpm test
        env:
          # Unit tests must not require production secrets.
          RAILRADAR_API_KEY: ''
          UPSTASH_REDIS_REST_URL: ''
          UPSTASH_REDIS_REST_TOKEN: ''
          RAILRADAR_DAILY_BUDGET: '50'

      - name: Production build
        run: pnpm run build
        env:
          # Build must succeed without live provider credentials.
          RAILRADAR_API_KEY: ''
          UPSTASH_REDIS_REST_URL: ''
          UPSTASH_REDIS_REST_TOKEN: ''
          NEXT_PUBLIC_MAPTILER_API_KEY: 'ci-placeholder'
